<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport ──────────────────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- ── Primary SEO ───────────────────────────────────────────────────── -->
    <!-- "Oil" kept singular here (not "Oils") — matches how people actually
         search the category ("coconut oil", "cold pressed oil"), and Google
         was snippeting our old plural-only title/description as a fuzzy
         match with a "Missing: oil" annotation on exact "oil" queries. -->
    <title>Sanathana Tattva — Authentic Cold Pressed Oil | Pure & Natural</title>
    <meta name="description" content="Sanathana Tattva offers authentic cold pressed oil — coconut, sesame, groundnut and more — made with traditional wooden churners. 100% pure, chemical-free, delivered to your door." />
    <meta name="keywords" content="cold pressed oil, wood pressed oil, chekku oil, groundnut oil, sesame oil, coconut oil, pure natural oil, chemical free oil, traditional oil, Sanathana Tattva" />
    <meta name="author" content="Sanathana Tattva" />
    <link rel="canonical" href="https://sanathanatattva.shop/" />

    <!-- ── Google Search Console verification ────────────────────────────── -->
    <!-- Replace the content value with the code from Search Console → Verification → HTML tag method -->
    <!-- <meta name="google-site-verification" content="PASTE_YOUR_CODE_HERE" /> -->

    <!-- ── Open Graph (Facebook / WhatsApp / LinkedIn) ───────────────────── -->

    <meta property="og:site_name"   content="Sanathana Tattva" />
    <meta property="og:title"       content="Sanathana Tattva — Authentic Cold Pressed Oil" />
    <meta property="og:description" content="Pure, chemical-free cold pressed oil made with traditional wooden churners. Coconut, sesame, groundnut and more — delivered fresh to your doorstep." />

    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="Sanathana Tattva cold pressed oil" />
    <meta property="og:locale"      content="en_IN" />

    <!-- ── Twitter Card ──────────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Sanathana Tattva — Authentic Cold Pressed Oil" />
    <meta name="twitter:description" content="Pure, chemical-free cold pressed oil made with traditional wooden churners. Delivered fresh to your doorstep." />
    <meta name="twitter:image"       content="https://sanathanatattva.shop/og-image.jpg" />

    <!-- ── Robots ────────────────────────────────────────────────────────── -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- ── OG image type + secure url (better previews) ──────────────────── -->
    <meta property="og:image:type"       content="image/jpeg" />
    <meta property="og:image:secure_url" content="https://sanathanatattva.shop/og-image.jpg" />

    <!-- ── Favicon & PWA ─────────────────────────────────────────────────── -->
    <link rel="icon"             type="image/png" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="manifest"         href="/site.webmanifest" />
    <meta name="theme-color" content="#14532d" />
    <meta name="apple-mobile-web-app-title" content="Sanathana Tattva" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://checkout.razorpay.com" />

    <!-- ── Structured Data — linked @graph (Organization + WebSite + Store) ──
         One graph so Google connects the entities via @id. All values are
         real: address + FSSAI from the registration certificate, states
         served from the business's actual delivery area. No fabricated
         ratings. -->
    <script type="application/ld+json">

      "@graph": [

          "@id": "https://sanathanatattva.shop/#organization",

          "legalName": "Gravity Traders",
          "url": "https://sanathanatattva.shop",
          "logo": {
            "@type": "ImageObject",
            "url": "https://sanathanatattva.shop/logo-192.png",
            "width": 192,
            "height": 192
          },
          "image": "https://sanathanatattva.shop/og-image.jpg",
          "description": "A family-run business pressing cold-pressed coconut, groundnut and sunflower oil in a traditional wooden ghani, without heat, delivered in a reusable steel can.",
          "email": "support@sanathanatattva.shop",
          "telephone": "+91-99729-22415",
          "foundingLocation": "Tumkur, Karnataka, India",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "164/1A, Halekatte, Kachihalli Village, Mayasandra, Turuvekere Taluk",
            "addressLocality": "Tumkur",
            "addressRegion": "Karnataka",
            "postalCode": "572227",
            "addressCountry": "IN"
          },
          "identifier": {
            "@type": "PropertyValue",
            "propertyID": "FSSAI",
            "value": "21226159000012"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "telephone": "+91-99729-22415",
            "email": "support@sanathanatattva.shop",
            "areaServed": "IN",
            "availableLanguage": ["en", "kn"]
          },
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://sanathanatattva.shop/#website",
          "name": "Sanathana Tattva",
          "url": "https://sanathanatattva.shop",
          "inLanguage": "en-IN",
          "publisher": { "@id": "https://sanathanatattva.shop/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://sanathanatattva.shop/shop?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": ["Store", "LocalBusiness"],
          "@id": "https://sanathanatattva.shop/#store",
          "name": "Sanathana Tattva",
          "url": "https://sanathanatattva.shop/shop",
          "image": "https://sanathanatattva.shop/og-image.jpg",
          "logo": "https://sanathanatattva.shop/logo-192.png",
          "description": "Cold-pressed coconut, groundnut and sunflower oil, pressed slowly in a wooden ghani without heat and delivered in a reusable steel can.",
          "parentOrganization": { "@id": "https://sanathanatattva.shop/#organization" },
          "telephone": "+91-99729-22415",
          "email": "support@sanathanatattva.shop",
          "priceRange": "₹₹",
          "currenciesAccepted": "INR",
          "paymentAccepted": "UPI, Credit Card, Debit Card, Net Banking, Cash on Delivery",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "164/1A, Halekatte, Kachihalli Village, Mayasandra, Turuvekere Taluk",
            "addressLocality": "Tumkur",
            "addressRegion": "Karnataka",

          },
          "areaServed": [

            "@type": "OfferCatalog",
            "name": "Cold-pressed oils",
            "itemListElement": [
              { "@type": "OfferCatalog", "name": "Cold-pressed coconut oil" },
              { "@type": "OfferCatalog", "name": "Cold-pressed groundnut oil" },
              { "@type": "OfferCatalog", "name": "Cold-pressed sunflower oil" }
            ]
          }
        }
      ]
    }
    </script>

    <!-- ── Fonts ──────────────────────────────────────────────────────────── -->
    <!-- Inter (one variable font, 300-900 continuous, so body weight can be dialled per surface) and
         EB Garamond: Google's own files, served from this site (src/fonts.css, public/fonts/) so the
         first paint doesn't wait on two more connections. The Latin files every page uses start
         downloading now; the other scripts load only if a page needs them. -->
    <link rel="preload" href="/fonts/inter-1dc044f482.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/eb-garamond-fbc7eeae79.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // The seal photo is the shop front page's largest paint. The page's code loads on demand,
      // so start fetching the photo alongside it, not after it; only on that page, not the
      // partner or delivery sites.
      if (location.pathname === '/' && !/^(partner|delivery)\./.test(location.hostname)) {
        var seal = document.createElement('link');
        seal.rel = 'preload'; seal.as = 'image'; seal.href = '/ghani-press.webp';
        seal.setAttribute('fetchpriority', 'high');
        document.head.appendChild(seal);
      }
    </script>

    <!-- ── Razorpay ───────────────────────────────────────────────────────── -->
    <!-- defer: no longer holds up the page while it downloads; it still runs before the app starts,
         so window.Razorpay is ready long before anyone taps Pay. -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
